name: Fetch Betting Odds

on:
  schedule:
    # Runs at 7am, 11am, 3pm, 7pm Mountain Time (MDT = UTC-6)
    # 7am MT = 1pm UTC (13:00)
    # 11am MT = 5pm UTC (17:00)
    # 3pm MT = 9pm UTC (21:00)
    # 7pm MT = 1am UTC next day (01:00)
    - cron: '0 13 * * *'  # 7am MT
    - cron: '0 17 * * *'  # 11am MT
    - cron: '0 21 * * *'  # 3pm MT
    - cron: '0 1 * * *'   # 7pm MT
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  fetch-odds:
    runs-on: ubuntu-latest

    steps:
      # Scripts come from main so fixes there take effect immediately
      - name: Checkout code (main)
        uses: actions/checkout@v5

      # Generated data lives on the data branch to avoid triggering site deploys
      - name: Checkout data branch
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Fetch odds from API
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm run fetch-odds

      - name: Commit and push if changes
        working-directory: data-branch
        run: |
          cp ../data/odds.json data/odds.json
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/odds.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: Update betting odds data"
          # The odds and standings jobs can run at the same time; rebase if the other pushed first
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data
          done
          exit 1
