name: Fetch Betting Odds

# Mountain Time: 8am (morning check, before 10-11am weekend kickoffs),
# 12pm (lunch, before 1:30-2:30pm kickoffs), 5pm (closing lines for 7pm games).
# 3 runs x 4 leagues = 12 Odds API credits/day (~372/month of the 500 free).
# Off the top of the hour, where GitHub's scheduled runs are most often delayed.

on:
  schedule:
    - cron: '5 0 * * *'
    - cron: '5 14 * * *'
    - cron: '5 15 * * *'
    - cron: '5 18 * * *'
    - cron: '5 19 * * *'
    - cron: '5 23 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  # GitHub cron only runs in UTC, so each Mountain Time slot is scheduled at both
  # its MST (UTC-7) and MDT (UTC-6) times. This job lets through only the one that
  # matches today's Mountain Time, so daylight saving is handled automatically.
  # Manual runs (workflow_dispatch) always go through.
  check-time:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check Mountain Time schedule
        id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MT_HOURS: '8,12,17'
        run: |
          node -e '
            const schedule = process.env.SCHEDULE;
            let run = true;
            if (schedule) {
              const scheduled = new Date();
              scheduled.setUTCHours(Number(schedule.split(" ")[1]), 0, 0, 0);
              const mtHour = Number(new Intl.DateTimeFormat("en-US", {
                timeZone: "America/Denver", hour: "numeric", hourCycle: "h23"
              }).format(scheduled));
              run = process.env.MT_HOURS.split(",").map(Number).includes(mtHour);
              console.log(`Scheduled for ${mtHour}:00 MT -> ${run ? "running" : "skipping"}`);
            }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
          '

  fetch-odds:
    needs: check-time
    if: needs.check-time.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      # Scripts come from main so fixes there take effect immediately
      - name: Checkout code (main)
        uses: actions/checkout@v5

      # Generated data lives on the data branch to avoid triggering site deploys
      - name: Checkout data branch
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Fetch odds from API
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm run fetch-odds

      - name: Commit and push if changes
        working-directory: data-branch
        run: |
          cp ../data/odds.json data/odds.json
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/odds.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: Update betting odds data"
          # The odds and standings jobs can run at the same time; rebase if the other pushed first
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data
          done
          exit 1
