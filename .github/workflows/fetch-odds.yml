name: Fetch Betting Odds

# Runs hourly, but only spends Odds API credits when something is due
# (see planOddsFetches in scripts/fetch-odds.js):
#   - About an hour before each of our teams' games: that league only (1 credit)
#   - Once a day after 8am MT: leagues with a game in the next week (1 credit each),
#     skipped when credits run low so pre-game fetches still have enough
# Most hourly runs find nothing due and use no credits.
# Off the top of the hour, where GitHub's scheduled runs are most often delayed.

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI
    inputs:
      mode:
        description: 'due = only what the schedule calls for; all = every league now (4 credits)'
        type: choice
        options: [due, all]
        default: due

jobs:
  fetch-odds:
    runs-on: ubuntu-latest

    steps:
      # Scripts come from main so fixes there take effect immediately
      - name: Checkout code (main)
        uses: actions/checkout@v5

      # Generated data lives on the data branch to avoid triggering site deploys
      - name: Checkout data branch
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATA_DIR: ${{ github.workspace }}/data-branch/data
        run: |
          if [ "${{ inputs.mode }}" = "all" ]; then
            npm run fetch-odds
          else
            npm run fetch-odds-due
          fi

      - name: Commit and push if changes
        working-directory: data-branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/odds.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: Update betting odds data"
          # The odds and standings jobs can run at the same time; rebase if the other pushed first
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git pull --rebase origin data
          done
          exit 1
